<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Purradise - cat pictures</title>
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <header>
      <a href="index.html" class="logo">Purradise</a>
      <nav>
        <button class="menu_toggle" id="menuToggle" aria-expanded="false">
          menu<svg
            class="menu_toggle_icon"
            viewBox="0 0 17 17"
            aria-hidden="true"
          >
            <path d="M5 7L8.5 10.5L12 7" />
          </svg>
        </button>
        <ul class="menu" id="mainMenu">
          <li><a href="index.html">start</a></li>
          <li><a href="breeds.html">cat breeds</a></li>
          <li><a href="facts.html">random cat facts</a></li>
          <li>
            <a href="pictures.html" class="active" aria-current="page"
              >random cat pictures</a
            >
          </li>
          <li><a href="memory.html">cat memory</a></li>
        </ul>
      </nav>
    </header>
    <main class="pictures_page">
      <section class="picture_grid">
        <article class="picture_card" id="pictureCard">
          <div class="picture_card_inner">
            <p class="picture_status" id="pictureStatus">
              cat picture loading...
            </p>
            <img
              class="cat_picture"
              id="catPicture"
              src=""
              alt="random cat picture"
            />
          </div>
        </article>
        <button class="picture_button" id="pictureButton">
          new cat picture
        </button>
      </section>
      <img
        class="cat_img_4"
        src="img/cat_pictures.png"
        alt="cat illustration"
      />
    </main>
    <footer>
      <p>@ 2026</p>
    </footer>
    <script src="js/script.js" type="module"></script>
  </body>
</html>
