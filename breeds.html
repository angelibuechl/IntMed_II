<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Purradise - cat breeds</title>
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body id="top">
    <header>
      <a href="index.html" class="logo">Purradise</a>
      <nav>
        <button class="menu_toggle" id="menuToggle" aria-expanded="false">
          menu<svg
            class="menu_toggle_icon"
            viewBox="0 0 17 17"
            aria-hidden="true"
          >
            <path d="M5 7L8.5 10.5L12 7" />
          </svg>
        </button>
        <ul class="menu" id="mainMenu">
          <li><a href="index.html">start</a></li>
          <li>
            <a href="breeds.html" class="active" aria-current="page"
              >cat breeds</a
            >
          </li>
          <li><a href="facts.html">random cat facts</a></li>
          <li><a href="pictures.html">random cat pictures</a></li>
          <li><a href="memory.html">cat memory</a></li>
        </ul>
      </nav>
    </header>
    <main class="breeds_page">
      <div class="breed_controls">
        <button class="sort_toggle" id="sortToggle" aria-expanded="false">
          sort by: <span id="sortLabel">breed name</span>
          <svg class="sort_toggle_icon" viewBox="0 0 17 17" aria-hidden="true">
            <path d="M5 7L8.5 10.5L12 7" />
          </svg>
        </button>
        <ul class="sort_menu" id="sortMenu">
          <li>
            <button class="sort_option active" data-value="breed_az">
              breed name a-z
            </button>
          </li>
          <li>
            <button class="sort_option" data-value="breed_za">
              breed name z-a
            </button>
          </li>
          <li>
            <button class="sort_option" data-value="country">country</button>
          </li>
          <li>
            <button class="sort_option" data-value="origin">origin</button>
          </li>
          <li><button class="sort_option" data-value="coat">coat</button></li>
          <li>
            <button class="sort_option" data-value="pattern">pattern</button>
          </li>
        </ul>
      </div>
      <section class="breed_grid" id="breedGrid">
        <p class="breed_status" id="breedStatus">cat breeds loading...</p>
      </section>
      <a
        href="#top"
        class="jump_up_button"
        id="bottomJumpButton"
        aria-label="jump up"
      >
        jump up ↑
      </a>
      <a
        href="#top"
        class="jump_up_button scroll_up_button"
        id="scrollUpButton"
        aria-label="jump up"
      >
        ↑
      </a>
      <img class="cat_img_2" src="img/cat_breeds.png" alt="cat illustration" />
    </main>
    <footer>
      <p>@ 2026 Angélica Büchler</p>
    </footer>
    <img
      class="mouse_cursor"
      id="mouseCursor"
      src="img/maus.png"
      alt=""
      aria-hidden="true"
    />
    <script src="js/script.js" type="module"></script>
  </body>
</html>
