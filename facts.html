<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Purradise - cat facts</title>
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <header>
      <a href="index.html" class="logo">Purradise</a>
      <nav>
        <button class="menu_toggle" id="menuToggle" aria-expanded="false">
          menu<svg
            class="menu_toggle_icon"
            viewBox="0 0 17 17"
            aria-hidden="true"
          >
            <path d="M5 7L8.5 10.5L12 7" />
          </svg>
        </button>
        <ul class="menu" id="mainMenu">
          <li><a href="index.html">start</a></li>
          <li><a href="breeds.html">cat breeds</a></li>
          <li>
            <a href="facts.html" class="active" aria-current="page"
              >random cat facts</a
            >
          </li>
          <li><a href="pictures.html">random cat pictures</a></li>
          <li><a href="memory.html">cat memory</a></li>
        </ul>
      </nav>
    </header>
    <main class="facts_page">
      <section class="fact_grid">
        <article class="fact_card">
          <div class="fact_card_inner">
            <p class="fact_status" id="factStatus">cat fact loading...</p>
            <p class="fact_text" id="factText"></p>
          </div>
        </article>
        <button class="fact_button" id="factButton">new cat fact</button>
      </section>
      <img class="cat_img_3" src="img/cat_facts.png" alt="cat illustration" />
    </main>
    <footer>
      <p>@ 2026</p>
    </footer>
    <img
      class="mouse_cursor"
      id="mouseCursor"
      src="img/maus.png"
      alt=""
      aria-hidden="true"
    />
    <script src="js/script.js" type="module"></script>
  </body>
</html>
